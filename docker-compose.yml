version: '3.8'

# Docker Compose lee automáticamente el archivo `.env` del mismo directorio
# para sustituir ${VARS}. El servicio `app` también carga ese archivo vía env_file.
# En el VPS: mantené un `.env` con los valores de producción (no se commitea).

services:
  # ---------------------------------------------------
  # 1. Servicio de PostgreSQL (Base de Datos)
  # ---------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: taller_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Root.1234}
      POSTGRES_DB: ${POSTGRES_DB:-mecnobile-db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------
  # 2. Servicio de Aplicación (Taller Node.js/Next.js)
  # ---------------------------------------------------
  app:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-taller-app}:${IMAGE_VERSION:-latest}
    container_name: taller_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Hora del taller: si queda en UTC, los turnos que enviamos por WhatsApp
      # salen corridos respecto a la hora elegida.
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      # Dentro de la red Docker el host de Postgres es el servicio "db"
      # (el DATABASE_URL del .env suele apuntar a localhost para Prisma CLI).
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-Root.1234}@db:5432/${POSTGRES_DB:-mecnobile-db}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET}}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Meta WhatsApp (también entran por env_file; listadas por claridad)
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_TEMPLATE_TURNO_CONFIRMADO: ${WHATSAPP_TEMPLATE_TURNO_CONFIRMADO:-turno_confirmado}
      WHATSAPP_TEMPLATE_TURNO_ALTERNATIVAS: ${WHATSAPP_TEMPLATE_TURNO_ALTERNATIVAS:-turno_alternativas}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es_AR}
      # Groq (opcional): reescribe el estado de OT en tono coloquial
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # SMTP para enviar historial PDF (autorización admin)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - db

volumes:
  postgres_data:
